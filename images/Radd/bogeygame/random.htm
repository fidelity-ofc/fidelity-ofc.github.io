<SCRIPT LANGUAGE="JavaScript1.1">
    
 
    function go_to(url) {
      window.location=url;
    }

   
    function rand_link() {
    var a;
      a = 1+Math.round(Math.random()*3);   
      if (a<2) go_to("ball2.htm");

    }

    // End of code -->
</script>
